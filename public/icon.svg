<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="6" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#blueGlow)" stroke-width="3" opacity="0.3"/>

  <!-- Glowing Workday Sunburst Arc Top -->
  <path d="M 176 130 C 220 100 292 100 336 130" fill="none" stroke="url(#goldGlow)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="256" cy="108" r="8" fill="#fbbf24" />
  <circle cx="210" cy="116" r="6" fill="#f59e0b" />
  <circle cx="302" cy="116" r="6" fill="#f59e0b" />

  <!-- Dynamic Enterprise 'W' & Infinity Symbol -->
  <g filter="url(#shadow)">
    <!-- Main Left Stem -->
    <path d="M 130 180 L 175 340 L 215 340 L 245 220 L 267 220 L 297 340 L 337 340 L 382 180 L 342 180 L 317 290 L 287 180 L 225 180 L 195 290 L 170 180 Z" fill="url(#blueGlow)" />
  </g>

  <!-- Golden Infinity Loop in the Heart of the W -->
  <path d="M 216 385 C 196 385 180 398 180 415 C 180 432 196 445 216 445 C 238 445 248 430 256 415 C 264 430 274 445 296 445 C 316 445 332 432 332 415 C 332 398 316 385 296 385 C 274 385 264 400 256 415 C 248 400 238 385 216 385 Z" 
        fill="none" stroke="url(#goldGlow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mini Star/Sparkle -->
  <polygon points="256,405 259,413 267,415 259,417 256,425 253,417 245,415 253,413" fill="#ffffff" />
</svg>
